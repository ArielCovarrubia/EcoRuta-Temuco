<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>EcoRutas La Araucanía: Contacto</title>
        <link rel="stylesheet" href="../../css/style.css">
    </head>
    <body data-page-title="EcoRuta Contacto">
        <div id="header-container"></div>

        <main class="contenedor-principal">
            <section class="contacto" aria-labelledby="titulo-contacto">
                <p class="intro-portada">¿Tienes dudas o quieres proponer una ruta? Contáctanos por cualquiera de estos medios.</p>
                <h2 id="titulo-contacto">Información de contacto</h2>

                <div class="info-contacto">
                    <p>Región de La Araucanía, Chile</p>
                    <p>Teléfono: <a href="tel:+56912345678">+56 9 1234 5678</a></p>
                    <p>Email: <a href="mailto:info@ecoruta.cl">info@ecoruta.cl</a></p>
                    <div class="redes-sociales-contacto">
                        <span class="enlace-desactivado" aria-disabled="true">Facebook</span>
                        <span class="enlace-desactivado" aria-disabled="true">Instagram</span>
                        <span class="enlace-desactivado" aria-disabled="true">Twitter</span>
                    </div>
                </div>

                <div class="tarjeta-formulario">
                    <h3>Envíanos un mensaje</h3>
                    <form id="formulario-contacto" novalidate>
                        <div class="campo-grupo">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" placeholder="Tu nombre completo">
                            <small class="mensaje-error" id="error-nombre"></small>
                        </div>

                        <div class="campo-grupo">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" placeholder="Tu nombre completo" aria-describedby="error-nombre">
                            <small class="mensaje-error" id="error-nombre" aria-live="polite"></small>
                        </div>
                        <div class="campo-grupo">
                            <label for="email">Correo electrónico:</label>
                            <input type="email" id="email" placeholder="ejemplo@correo.com" aria-describedby="error-email">
                            <small class="mensaje-error" id="error-email" aria-live="polite"></small>
                        </div>
                        <div class="campo-grupo">
                            <label for="mensaje">Mensaje:</label>
                            <textarea id="mensaje" rows="4" placeholder="Escribe tu mensaje (minimo 10 caracteres)" aria-describedby="error-mensaje"></textarea>
                            <small class="mensaje-error" id="error-mensaje" aria-live="polite"></small>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <div id="footer-container"></div>
        <script src="../../js/layout.js"></script>
        <script src="../../js/script.js"></script>
    </body>
    </html>
